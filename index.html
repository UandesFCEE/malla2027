  function resolveTarget(target, mencionKey) {
    if (!target || target === "nohomologable" || target === "certificacion" || target === "pairedOptativo" || target === "pairedIngles1" || target === "pairedPracticaProf") return null;
    if (target === "genericFallback") return { generic: true };
    if (typeof target === "string") return { id: target };
    if (target.byMencion) {
      const specific = target.byMencion[mencionKey];
      if (specific) return { id: specific };
      if (target.default) return { id: target.default };
      if (target.genericFallback) return { generic: true };
      return null;
    }
    return null;
  }
  function allOldCourses() {
    return OLD_GROUP_ORDER.flatMap((g) => OLD_MALLA[g]);
  }
  function defaultOldApproved() {
    return {};
  }
  function applyDefaultForView(view) {
    const groupsToMark = view === "2025" ? ["I", "II", "III", "IV"] : view === "2026" ? ["I", "II"] : [];
    const next = {};
    groupsToMark.forEach((g) => {
      (OLD_MALLA[g] || []).forEach((c) => {
        next[c.id] = true;
      });
    });
    state.oldApproved = next;
  }
  function buildNewSemesters(mencionKey) {
    const mencion = MENCIONES[mencionKey];
    const sems = [];
    for (let s = 1; s <= 10; s++) {
      let courses = [];
      if (CICLO_BASICO[s]) courses = courses.concat(CICLO_BASICO[s]);
      if (CICLO_ESP_COMUN[s]) courses = courses.concat(CICLO_ESP_COMUN[s]);
      if (mencion[s]) courses = courses.concat(mencion[s]);
      sems.push({ num: s, courses });
    }
    return sems;
  }
  function buildGrid(semesters, remapCol) {
    const grid = {};
    GROUPS.forEach((g) => (grid[g.id] = {}));
    const pushToGrid = (course, col) => {
      const effCol = remapCol ? remapCol(course, col) : col;
      const groupId = TRACK_GROUP[course.track] || course.track;
      if (!grid[groupId][effCol]) grid[groupId][effCol] = [];
      grid[groupId][effCol].push(course);
    };
    pushToGrid(PRACTICA_OPERATIVA, "P");
    pushToGrid(EXAMEN_GRADO, "E");
    semesters.forEach((sem) => sem.courses.forEach((c) => pushToGrid(c, sem.num)));
    // Los Electivos de Especialidad siempre se muestran antes que las
    // tarjetas de Especialización (mención) dentro de la misma celda.
    Object.keys(grid).forEach((groupId) => {
      Object.keys(grid[groupId]).forEach((col) => {
        grid[groupId][col] = grid[groupId][col]
          .map((c, i) => ({ c, i, isElectivo: GENERIC_ELECTIVE_IDS.includes(c.id) ? 0 : 1 }))
          .sort((a, b) => a.isElectivo - b.isElectivo || a.i - b.i)
          .map((x) => x.c);
      });
    });
    return grid;
  }
  function toRoman(n) {
    const map = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];
    return map[n - 1] || n;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }

  let saveTimer = null;
  function scheduleSave() {
    state.saving = true;
    renderSavingIndicator();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try {
        await window.storage.set(
          STORAGE_KEY,
          JSON.stringify({ mencion: state.mencionKey, oldApproved: state.oldApproved, newOverride: state.newOverride, mallaView: state.mallaView })
        );
      } catch (e) {}
      state.saving = false;
      renderSavingIndicator();
    }, 400);
  }

  async function loadState() {
    try {
      const res = await window.storage.get(STORAGE_KEY);
      if (res && res.value) {
        const parsed = JSON.parse(res.value);
        if (parsed.mencion) state.mencionKey = parsed.mencion;
        if (parsed.oldApproved) state.oldApproved = parsed.oldApproved;
        if (parsed.newOverride) state.newOverride = parsed.newOverride;
        if (parsed.mallaView) state.mallaView = parsed.mallaView;
      }
    } catch (e) {}
    state.loaded = true;
    render();
  }

  function toggleOld(id) {
    state.oldApproved[id] = !state.oldApproved[id];
    scheduleSave();
    render();
  }
  function cycleNew(id) {
    const order = ["pendiente", "cursando", "aprobado"];
    const cur = state.newOverride[id] || "pendiente";
    state.newOverride[id] = order[(order.indexOf(cur) + 1) % order.length];
    scheduleSave();
    render();
  }
  function resetAll() {
    if (confirm("¿Reiniciar toda la información marcada en ambas mallas? Esta acción no se puede deshacer.")) {
      state.oldApproved = defaultOldApproved();
      state.newOverride = {};
      scheduleSave();
      render();
    }
  }
  function markAllOld() {
    const next = {};
    allOldCourses().forEach((c) => (next[c.id] = true));
    state.oldApproved = next;
    scheduleSave();
    render();
  }
  function unmarkAllOld() {
    state.oldApproved = {};
    scheduleSave();
    render();
  }
  function toggleMarkGroup(g) {
    const courses = OLD_MALLA[g];
    const allChecked = courses.every((c) => state.oldApproved[c.id]);
    courses.forEach((c) => {
      if (allChecked) delete state.oldApproved[c.id];
      else state.oldApproved[c.id] = true;
    });
    scheduleSave();
    render();
  }
  function toggleOldPanel() {
    state.oldOpen = !state.oldOpen;
    render();
  }

  function computeConvalidation(mencionKey) {
    const mappableNewIds = new Set();
    allOldCourses().forEach((c) => {
      const r = resolveTarget(c.target, mencionKey);
      if (r && r.id) mappableNewIds.add(r.id);
    });

    const convalidatedIds = new Set();
    const convalidatedSource = {};
    const genericSources = [];
    allOldCourses().forEach((c) => {
      if (state.oldApproved[c.id]) {
        const r = resolveTarget(c.target, mencionKey);
        if (r && r.id) {
          convalidatedIds.add(r.id);
          convalidatedSource[r.id] = c.name;
        } else if (r && r.generic) {
          genericSources.push(c.name);
        }
      }
    });
    // Optativo Pregrado I + II, juntos, convalidan un único Electivo de Especialidad
    if (state.oldApproved["old_optpre1"] && state.oldApproved["old_optpre2"]) {
      genericSources.push("Optativo Pregrado I + II");
    }
    // Inglés III + Inglés IV, en conjunto, convalidan Inglés Profesional I
    if (state.oldApproved["old_ingles3"] && state.oldApproved["old_ingles4"]) {
      convalidatedIds.add("ingles1");
      convalidatedSource["ingles1"] = "Inglés III + Inglés IV";
    }
    // Práctica Profesional (14 SCT) + un Optativo de Magíster (7 SCT), en conjunto, convalidan Práctica Profesional (21 SCT)
    const OPT_MAG_IDS = ["old_optmag1a", "old_optmag1e", "old_optmag2a", "old_optmag2e", "old_optmag3a", "old_optmag3e"];
    const usedOptMagId = OPT_MAG_IDS.find((id) => state.oldApproved[id]);
    if (state.oldApproved["old_practicaprof"] && usedOptMagId) {
      const usedOptMagCourse = allOldCourses().find((c) => c.id === usedOptMagId);
      convalidatedIds.add("practicaprof");
      convalidatedSource["practicaprof"] = `Práctica Profesional + ${usedOptMagCourse.name}`;
    }
    let filled = 0;
    for (const eid of GENERIC_ELECTIVE_IDS) {
      if (filled >= genericSources.length) break;
      if (!convalidatedIds.has(eid)) {
        convalidatedIds.add(eid);
        convalidatedSource[eid] = genericSources[filled];
        filled++;
      }
    }
    const genericCount = genericSources.length;

    function getNewStatus(id) {
      if (convalidatedIds.has(id)) return "convalidado";
      if (state.newOverride[id]) return state.newOverride[id];
      return "pendiente";
    }

    return { mappableNewIds, convalidatedIds, convalidatedSource, genericCount, getNewStatus };
  }

  /* ============================================================
     DESCARGA PDF (html2canvas + jsPDF)
     Genera una vista vertical (solo malla nueva, semestre a semestre
     hacia abajo), independiente del layout horizontal en pantalla.
     ============================================================ */
  function buildPrintableMallaHTML(mencionKey) {
    const { mappableNewIds, convalidatedSource, getNewStatus } = computeConvalidation(mencionKey);
    const newSemesters = buildNewSemesters(mencionKey);
    const grid = buildGrid(newSemesters);
    const columnKeys = [1, 2, 3, 4, "P", 5, 6, 7, 8, "E", 9, 10];
    const colLabel = (k) => (k === "P" ? "Práctica Operativa" : k === "E" ? "Examen de Grado" : `Semestre ${toRoman(k)}`);

    let totalCred = 0;
    let doneCred = 0;

    const sections = columnKeys
      .map((k) => {
        let rows = "";
        let semTotal = 0;
        let semDone = 0;
        GROUPS.forEach((group) => {
          const courses = grid[group.id][k] || [];
          courses.forEach((course) => {
            const status = getNewStatus(course.id);
            const colors = STATUS_COLORS[status];
            const specNum = SPEC_NUMBER_MAP[k] && (course.track === "discA" ? SPEC_NUMBER_MAP[k].discA : course.track === "discB" ? SPEC_NUMBER_MAP[k].discB : null);
            const displayName = specNum ? `Especialización ${toRoman(specNum)} (${course.name})` : course.name;
            const sourceTxt = status === "convalidado" && convalidatedSource[course.id] ? ` — (${esc(convalidatedSource[course.id])})` : "";
            semTotal += course.cred;
            if (status === "aprobado" || status === "convalidado") semDone += course.cred;
            rows += `
              <div class="p-row">
                <span class="p-status-dot" style="background:${status === "pendiente" ? "#fff" : colors.pill}; border-color:${colors.border};"></span>
                <span class="p-name">${esc(displayName)}<span class="p-source">${sourceTxt}</span></span>
                <span class="p-cred">${course.cred} SCT</span>
              </div>`;
          });
        });
        totalCred += semTotal;
        doneCred += semDone;
        if (!rows) return "";
        return `
          <div class="p-section">
            <div class="p-section-header"><span>${esc(colLabel(k))}</span><span>${semDone} / ${semTotal} SCT</span></div>
            ${rows}
          </div>`;
      })
      .join("");

    return `
      <div class="p-doc">
        <div class="p-doc-header">
          <div class="p-doc-eyebrow">Facultad de Ciencias Económicas y Empresariales</div>
          <div class="p-doc-title">Simulador de malla 2027</div>
          <div class="p-doc-sub">Mención ${esc(MENCIONES[mencionKey].label)} · ${doneCred} / ${totalCred} SCT cumplidos</div>
        </div>
        ${sections}
      </div>`;
  }

  async function downloadPdf() {
    const btn = document.getElementById("m-pdf-btn");
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Generando PDF…";

    // Capturamos únicamente el panel de la malla nueva (grilla), sin la malla
    // antigua ni el resto de la interfaz.
    const panel = document.querySelector(".m-new-panel");
    const scrollBox = panel ? panel.querySelector(".m-grid-scroll") : null;
    const prevOverflow = scrollBox ? scrollBox.style.overflow : "";
    const prevWidth = scrollBox ? scrollBox.style.width : "";
    if (scrollBox) {
      scrollBox.style.overflow = "visible";
      scrollBox.style.width = "max-content";
    }

    // esperar a que el reflow aplique antes de medir/capturar
    await new Promise((r) => setTimeout(r, 60));

    try {
      const target = panel;
      const fullWidth = Math.max(target.scrollWidth, target.offsetWidth);
      const fullHeight = Math.max(target.scrollHeight, target.offsetHeight);
      const canvas = await html2canvas(target, {
        scale: 2,
        backgroundColor: "#EDEAE5",
        useCORS: true,
        scrollX: 0,
        scrollY: 0,
        windowWidth: fullWidth,
        windowHeight: fullHeight,
        width: fullWidth,
        height: fullHeight,
      });
      const { jsPDF } = window.jspdf;
      const imgData = canvas.toDataURL("image/png");
      const pxToMm = 0.264583 / 2; // scale:2
      const wMm = canvas.width * pxToMm;
      const hMm = canvas.height * pxToMm;
      const pdf = new jsPDF({ orientation: wMm > hMm ? "landscape" : "portrait", unit: "mm", format: [wMm, hMm] });
      pdf.addImage(imgData, "PNG", 0, 0, wMm, hMm);

      // Intento 1: descarga directa (funciona en la mayoría de navegadores)
      let downloadWorked = true;
      try {
        pdf.save("malla-icom-2027.pdf");
      } catch (e) {
        downloadWorked = false;
      }

      // Intento 2 (respaldo): abrir el PDF en una pestaña nueva si la descarga
      // directa está bloqueada (común dentro de iframes con sandbox). Desde ahí
      // se puede guardar con el botón de descarga del visor o Ctrl+S.
      try {
        const blobUrl = pdf.output("bloburl");
        const opened = window.open(blobUrl, "_blank");
        if (!opened) {
          // El navegador bloqueó la ventana emergente: ofrecer el enlace directo
          const a = document.createElement("a");
          a.href = blobUrl;
          a.target = "_blank";
          a.textContent = "Abrir PDF generado";
          a.style.cssText = "display:block;margin-top:8px;color:#CE0019;font-weight:700;";
          btn.insertAdjacentElement("afterend", a);
        }
      } catch (e2) {
        if (!downloadWorked) {
          alert("No se pudo generar ni descargar el PDF automáticamente: " + e2.message);
        }
      }
    } catch (e) {
      alert("No se pudo generar el PDF: " + e.message);
    } finally {
      if (scrollBox) {
        scrollBox.style.overflow = prevOverflow;
        scrollBox.style.width = prevWidth;
      }
      btn.disabled = false;
      btn.textContent = original;
    }
  }

    /* ---------- malla actual ---------- */
    if (state.oldOpen && state.mallaView !== "2027") {
      const allOldChecked = allOldCourses().every((c) => state.oldApproved[c.id]);
      const anyOldChecked = allOldCourses().some((c) => state.oldApproved[c.id]);
      html += `<div class="m-old-panel">
        <div class="m-panel-heading-row">
          <div class="m-panel-heading">Malla actual - Ing. Comercial</div>

            <button type="button" id="m-unmark-all-btn" class="m-mark-all-btn no-pdf secondary" ${!anyOldChecked ? "disabled" : ""}>Desmarcar todo</button>
          </span>
        </div>
        <div class="m-old-panel-instructions">Selecciona los cursos que tengas aprobados y deselecciona los que no.</div>`;
      html += `<div class="m-old-groups">`;
      OLD_GROUP_ORDER.forEach((g) => {
        const courses = OLD_MALLA[g];
        const done = courses.filter((c) => state.oldApproved[c.id]).length;
        const allGroupChecked = courses.every((c) => state.oldApproved[c.id]);
        html += `<div class="m-old-group">
          <div class="m-old-group-header">
            <span>Semestre ${g}</span>
            <span class="m-old-group-header-right">
              <span class="m-old-group-count">${done}/${courses.length}</span>
              <button type="button" class="m-mark-group-btn no-pdf" data-group="${g}">${allGroupChecked ? "Desmarcar" : "Marcar todo"}</button>
            </span>
          </div>`;
        courses.forEach((c) => {
          const r = resolveTarget(c.target, mencionKey);
          const isChecked = !!state.oldApproved[c.id];
          let hint = "";
          let noteOverride = null;
          if (c.target === "nohomologable") {
            const isOptMag = ["old_optmag1a", "old_optmag1e", "old_optmag2a", "old_optmag2e", "old_optmag3a", "old_optmag3e"].includes(c.id);
            if (isOptMag) {
              hint = " · junto con Práctica Profesional convalida Práctica Profesional (21 SCT)";
              const practicaChecked = !!state.oldApproved["old_practicaprof"];
              if (isChecked && practicaChecked) noteOverride = "✓ Convalida Práctica Profesional junto con Práctica Profesional (14 SCT)";
              else if (isChecked) noteOverride = "Falta marcar también Práctica Profesional para convalidar";
            } else {
              hint = " · sin homologación";
            }
          } else if (c.target === "certificacion") {
            hint = " · acredita nivel de inglés";
            if (c.id === "old_ingles1" || c.id === "old_ingles2") {
              const bothChecked = !!state.oldApproved["old_ingles1"] && !!state.oldApproved["old_ingles2"];
              if (bothChecked) noteOverride = "✓ Inglés I + II: nivel B1 acreditado";
              else if (isChecked) noteOverride = "Falta el otro curso para acreditar B1 en conjunto";
              else noteOverride = c.note;
            }
          } else if (c.target === "pairedOptativo") {
            hint = " · electivo de especialidad (junto con el otro Optativo)";
            const bothChecked = !!state.oldApproved["old_optpre1"] && !!state.oldApproved["old_optpre2"];
            if (bothChecked) noteOverride = "✓ Optativo I + II: convalida 1 Electivo de Especialidad";
            else if (isChecked) noteOverride = "Falta el otro Optativo — juntos convalidan solo 1 electivo";
          } else if (c.target === "pairedIngles1") {
            hint = " · Inglés Profesional I (junto con el otro Inglés)";
            const otherId = c.id === "old_ingles3" ? "old_ingles4" : "old_ingles3";
            const bothChecked = !!state.oldApproved["old_ingles3"] && !!state.oldApproved["old_ingles4"];
            if (bothChecked) noteOverride = "✓ Inglés III + IV: convalida Inglés Profesional I";
            else if (isChecked) noteOverride = "Falta el otro curso para convalidar Inglés Profesional I";
          } else if (c.target === "pairedPracticaProf") {
            hint = " · Práctica Profesional (junto con un Optativo de Magíster)";
            const anyOptMag = ["old_optmag1a", "old_optmag1e", "old_optmag2a", "old_optmag2e", "old_optmag3a", "old_optmag3e"].some((id) => state.oldApproved[id]);
            if (anyOptMag) noteOverride = "✓ Práctica Profesional + Optativo de Magíster: convalida Práctica Profesional (21 SCT)";
            else noteOverride = "Falta marcar también un Optativo de Magíster para convalidar";
          } else if (r && r.generic) hint = " · electivo de especialidad";
          const noteText = noteOverride !== null ? noteOverride : c.note;
          html += `
            <button type="button" class="m-old-row ${isChecked ? "checked" : ""}" data-old-id="${c.id}">
              <span class="m-old-checkbox">${isChecked ? "✓" : ""}</span>
              <span class="m-old-row-text">
                <span class="m-old-row-name">${esc(c.name)}</span>
                <span class="m-old-row-meta">${esc(c.code)} · ${c.cred} SCT${hint}</span>
                ${noteText ? `<span class="m-old-row-note">${esc(noteText)}</span>` : ""}
              </span>
            </button>`;
        });
        html += `</div>`;
      });
      html += `</div></div>`;
    }

    /* ---------- malla nueva ---------- */
    const columnTotals = {};
    const columnDone = {};
    columnKeys.forEach((k) => {
      columnTotals[k] = 0;
      columnDone[k] = 0;
    });
    GROUPS.forEach((g) => {
      columnKeys.forEach((k) => {
        const courses = grid[g.id][k] || [];
        courses.forEach((course) => {
          columnTotals[k] += course.cred;
          const st = getNewStatus(course.id);
          if (st === "aprobado" || st === "convalidado") columnDone[k] += course.cred;
        });
      });
    });
    // sumar Práctica Operativa y Examen de Grado (ya incluidos en el grid vía 'P'/'E')
    const grandTotal = columnKeys.reduce((a, k) => a + columnTotals[k], 0);
    const grandDone = columnKeys.reduce((a, k) => a + columnDone[k], 0);

    html += `<div class="m-new-panel">
      <div class="m-panel-heading">${state.mallaView === "2027" ? "Malla nueva 2027" : `Malla de Transición Cohorte ${state.mallaView}`} <span class="m-panel-heading-sub">· ${esc(MENCIONES[mencionKey].label)}</span></div>
      <div class="m-grid-scroll">
        <div class="m-grid-table" style="grid-template-columns: 170px ${columnKeys.map((k) => (k === "P" || k === "E" ? "56px" : "118px")).join(" ")};">
          <div class="m-grid-corner"></div>
          ${columnKeys.map((k) => `<div class="m-grid-sem-header${k === "P" || k === "E" ? " narrow" : ""}">${k === "P" || k === "E" ? "" : "Sem. " + toRoman(k)}</div>`).join("")}
          ${GROUPS.map((group, gi) => {
            const prevSection = gi > 0 ? GROUPS[gi - 1].section : null;
            const sectionHeader =
              group.section && group.section !== prevSection
                ? `<div class="m-grid-section-header">${esc(group.section)}</div>`
                : "";
            let row = sectionHeader + `<div class="m-grid-track-label">${esc(group.label)}${group.sublabel ? `<span class="m-grid-track-sublabel">${esc(group.sublabel)}</span>` : ""}</div>`;
            row += columnKeys
              .map((k) => {
                let courses = grid[group.id][k] || [];
                if (courses.length === 0) return `<div class="m-grid-cell"></div>`;
                if (group.id === "discipEspecifica" && (k === 5 || k === 6)) {
                  const specIdx = courses.findIndex((c) => c.track === "discA" || c.track === "discB");
                  if (specIdx !== -1) {
                    courses = courses.slice();
                    courses.splice(specIdx, 0, { id: `__spacer_${k}`, spacer: true });
                  }
                }
                const isNarrowCol = k === "P" || k === "E";
                const cardsHtml = courses
                  .map((course) => {
                    if (course.spacer) return `<div class="m-grid-card-spacer"></div>`;
                    const status = getNewStatus(course.id);
                    const editable = false;
                    const colors = STATUS_COLORS[status];
                    const specNum = SPEC_NUMBER_MAP[k] && (course.track === "discA" ? SPEC_NUMBER_MAP[k].discA : course.track === "discB" ? SPEC_NUMBER_MAP[k].discB : null);
                    const electivoMatch = /^Electivo de Especialidad (\d+)$/.exec(course.name);
                    const displayNameHtml = specNum
                      ? `Especialización ${toRoman(specNum)}<br><span class="m-grid-card-specname">${esc(course.name)}</span>`
                      : electivoMatch
                      ? `Electivo de Especialidad<br><span class="m-grid-card-specname">${esc(electivoMatch[1])}</span>`
                      : esc(course.name);
                    const displayNamePlain = specNum ? `Especialización ${toRoman(specNum)} (${course.name})` : course.name;
                    const sourceNote = status === "convalidado" && convalidatedSource[course.id] ? `<div class="m-grid-card-source">(${esc(convalidatedSource[course.id])})</div>` : "";
                    if (isNarrowCol) {
                      return `
                      <button type="button" class="m-grid-card narrow" data-new-id="${course.id}" data-editable="${editable ? "1" : "0"}"
                        style="background:${colors.bg};border-color:${colors.border};cursor:${editable ? "pointer" : "default"}">
                        <span class="m-status-pill" style="background:${status === "pendiente" ? "transparent" : colors.pill};border-color:${colors.pill};color:${status === "pendiente" ? colors.text : "#fff"}">${STATUS_LABEL[status]}</span>
                        <span class="m-grid-card-name">${esc(displayNamePlain)} — ${course.cred} SCT</span>
                      </button>`;
                    }
                    return `
                    <button type="button" class="m-grid-card" data-new-id="${course.id}" data-editable="${editable ? "1" : "0"}"
                      style="background:${colors.bg};border-color:${colors.border};cursor:${editable ? "pointer" : "default"}">
                      <div class="m-grid-card-top">
                        <span class="m-grid-card-name">${displayNameHtml}</span>
                        <span class="m-status-pill" style="background:${status === "pendiente" ? "transparent" : colors.pill};border-color:${colors.pill};color:${status === "pendiente" ? colors.text : "#fff"}">${STATUS_LABEL[status]}</span>
                      </div>
                      ${course.note ? `<div class="m-grid-card-note">${esc(course.note)}</div>` : ""}
                      ${sourceNote}
                      <div class="m-grid-card-meta"><span>${course.cred} SCT</span></div>
                    </button>`;
                  })
                  .join("");
                return `<div class="m-grid-cell">${cardsHtml}</div>`;
              })
              .join("");
            return row;
          }).join("")}
          <div class="m-grid-total-label">Total SCT<div class="m-grid-total-grand">${grandTotal}</div></div>
          ${columnKeys.map((k) => `<div class="m-grid-total-cell">${columnTotals[k]}</div>`).join("")}
          <div class="m-grid-done-label">Cumplidos<div class="m-grid-done-grand">${grandDone}</div></div>
          ${columnKeys.map((k) => `<div class="m-grid-done-cell${columnDone[k] === columnTotals[k] && columnTotals[k] > 0 ? " complete" : ""}">${columnDone[k]}</div>`).join("")}
        </div>
      </div>
    </div>`;

    html += `</main>
      <footer class="m-footer">
        <span></span>
        <span id="m-saving" style="opacity:${state.saving ? 1 : 0};transition:opacity .3s">Guardando…</span>
      </footer>`;

    root.innerHTML = html;

    // Restaurar posiciones de scroll tras reconstruir el HTML
    window.scrollTo(prevWindowScrollX, prevWindowScrollY);
    const newOldGroupsEl = document.querySelector(".m-old-groups");
    if (newOldGroupsEl) newOldGroupsEl.scrollTop = prevOldGroupsScrollTop;
    const newGridScrollEl = document.querySelector(".m-grid-scroll");
    if (newGridScrollEl) {
      newGridScrollEl.scrollLeft = prevGridScrollLeft;
      newGridScrollEl.scrollTop = prevGridScrollTop;
    }

    /* ---------- listeners ---------- */
    document.getElementById("m-mencion-select").addEventListener("change", (e) => {
      state.mencionKey = e.target.value;
      scheduleSave();
      render();
    });
    root.querySelectorAll(".m-malla-tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.mallaView = btn.getAttribute("data-malla-view");
        applyDefaultForView(state.mallaView);
        scheduleSave();
        render();
      });
    });
    document.getElementById("m-pdf-btn").addEventListener("click", downloadPdf);
    document.getElementById("m-reset-btn").addEventListener("click", resetAll);
    const toggleBtn = document.getElementById("m-toggle-old-btn");
    if (toggleBtn) toggleBtn.addEventListener("click", toggleOldPanel);
    const markAllBtn = document.getElementById("m-mark-all-btn");
    if (markAllBtn) markAllBtn.addEventListener("click", markAllOld);
    const unmarkAllBtn = document.getElementById("m-unmark-all-btn");
    if (unmarkAllBtn) unmarkAllBtn.addEventListener("click", unmarkAllOld);
    root.querySelectorAll(".m-mark-group-btn").forEach((btn) => {
      btn.addEventListener("click", () => toggleMarkGroup(btn.getAttribute("data-group")));
    });

    root.querySelectorAll(".m-old-row").forEach((btn) => {
      btn.addEventListener("click", () => toggleOld(btn.getAttribute("data-old-id")));
    });
    root.querySelectorAll(".m-grid-card").forEach((btn) => {
      if (btn.getAttribute("data-editable") === "1") {
        btn.addEventListener("click", () => cycleNew(btn.getAttribute("data-new-id")));
      }
    });
  }

  loadState();
})();
</script>
